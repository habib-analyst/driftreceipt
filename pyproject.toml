[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "driftreceipt"
version = "0.1.0"
description = "One-call drift receipt for a deployed classifier — GO / CAUTION / NO-GO from two windows of logged predictions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Habib Ur Rehman" },
]
keywords = [
    "model-monitoring",
    "drift-detection",
    "prediction-drift",
    "ml-observability",
    "model-drift",
    "data-drift",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/habib-analyst/driftreceipt"
Issues = "https://github.com/habib-analyst/driftreceipt/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
